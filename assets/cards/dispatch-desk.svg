<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-label="Dispatch Desk card">
<rect width="1000" height="570" rx="28" fill="#10243E"/>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" x="40" y="34" width="120" height="120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B2A78"/><stop offset="1" stop-color="#7E57C2"/></linearGradient></defs><rect width="120" height="120" rx="26" fill="url(#g)"/><circle cx="60" cy="30" r="9" fill="#fff"/><circle cx="30" cy="60" r="9" fill="#fff"/><circle cx="85" cy="68" r="9" fill="#FFB74D"/><path d="M60 30 L30 60 M60 30 L85 68 M30 60 L85 68" stroke="#fff" stroke-width="4"/></svg>
<text x="188" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#FFB74D">PLUGIN · 13 ROUTERS</text>
<text x="188" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="44" font-weight="800" fill="#fff">Dispatch Desk</text>
<text x="188" y="138" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#C9D6E6">A switchboard: tells Claude which tool should handle</text>
<text x="188" y="164" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#C9D6E6">which job, so it stops guessing.</text>
<rect x="790" y="34" width="170" height="40" rx="20" fill="#2EA44F"/><text x="875" y="60" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">100% FREE</text>
<text x="40" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#FFB74D">HOW IT WORKS</text>
<rect x="40" y="214" width="293" height="165" rx="18" fill="#fff" opacity=".97"/>
<circle cx="76" cy="250" r="19" fill="#0B3A6F"/><text x="76" y="257" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">1</text>
<text x="62" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">You describe a job: a post,</text>
<text x="62" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">a report, an ad, a video.</text>
<text x="343.0" y="304" text-anchor="middle" font-size="16" fill="#FFB74D">&#9654;</text>
<rect x="353" y="214" width="293" height="165" rx="18" fill="#fff" opacity=".97"/>
<circle cx="389" cy="250" r="19" fill="#0B3A6F"/><text x="389" y="257" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">2</text>
<text x="375" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">A router for that area</text>
<text x="375" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">picks one winner tool,</text>
<text x="375" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">never two that overlap.</text>
<text x="656.0" y="304" text-anchor="middle" font-size="16" fill="#FFB74D">&#9654;</text>
<rect x="666" y="214" width="293" height="165" rx="18" fill="#fff" opacity=".97"/>
<circle cx="702" cy="250" r="19" fill="#0B3A6F"/><text x="702" y="257" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">3</text>
<text x="688" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">Claude uses that tool, with</text>
<text x="688" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">the right settings and</text>
<text x="688" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">approvals.</text>
<text x="40" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#FFB74D">WORKS WITH (all optional)</text>
<rect x="40" y="422" width="64" height="34" rx="17" fill="#1D3A5E"/><text x="72.0" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">Make</text>
<rect x="114" y="422" width="81" height="34" rx="17" fill="#1D3A5E"/><text x="154.5" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">Zapier</text>
<rect x="205" y="422" width="73" height="34" rx="17" fill="#1D3A5E"/><text x="241.5" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">Canva</text>
<rect x="288" y="422" width="73" height="34" rx="17" fill="#1D3A5E"/><text x="324.5" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">Figma</text>
<rect x="371" y="422" width="73" height="34" rx="17" fill="#1D3A5E"/><text x="407.5" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">Gmail</text>
<rect x="454" y="422" width="98" height="34" rx="17" fill="#1D3A5E"/><text x="503.0" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">WhatsApp</text>
<rect x="562" y="422" width="55" height="34" rx="17" fill="#1D3A5E"/><text x="589.5" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">Wix</text>
<rect x="627" y="422" width="98" height="34" rx="17" fill="#1D3A5E"/><text x="676.0" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">Composio</text>
<rect x="40" y="512" width="920" height="42" rx="10" fill="#0A1626"/><text x="58" y="539" font-family="Consolas,Menlo,monospace" font-size="15" fill="#7EE787">$ claude plugin install dispatch-desk@digi-plugins</text>
</svg>