<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-label="Forge card">
<rect width="1000" height="570" rx="28" fill="#10243E"/>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" x="40" y="34" width="120" height="120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7A1F1F"/><stop offset="1" stop-color="#EF5350"/></linearGradient></defs><rect width="120" height="120" rx="26" fill="url(#g)"/><path d="M30 78 H90 V88 H30 Z" fill="#fff"/><path d="M38 78 V62 H82 V78" fill="#fff"/><path d="M60 62 V30 M45 45 L60 30 L75 45" stroke="#FFB74D" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
<text x="188" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#FFB74D">PLUGIN · 4 AGENTS + 1 SKILL</text>
<text x="188" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="44" font-weight="800" fill="#fff">Forge</text>
<text x="188" y="138" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#C9D6E6">Upgrades an app or page that already exists: right-to-</text>
<text x="188" y="164" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#C9D6E6">left, mobile, accessibility, speed, design.</text>
<rect x="790" y="34" width="170" height="40" rx="20" fill="#2EA44F"/><text x="875" y="60" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">100% FREE</text>
<text x="40" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#FFB74D">HOW IT WORKS</text>
<rect x="40" y="214" width="293" height="165" rx="18" fill="#fff" opacity=".97"/>
<circle cx="76" cy="250" r="19" fill="#0B3A6F"/><text x="76" y="257" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">1</text>
<text x="62" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">It scans your app and opens</text>
<text x="62" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">it in a real browser.</text>
<text x="343.0" y="304" text-anchor="middle" font-size="16" fill="#FFB74D">&#9654;</text>
<rect x="353" y="214" width="293" height="165" rx="18" fill="#fff" opacity=".97"/>
<circle cx="389" cy="250" r="19" fill="#0B3A6F"/><text x="389" y="257" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">2</text>
<text x="375" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">It plans sprints, fixes</text>
<text x="375" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">issues, and commits each</text>
<text x="375" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">sprint on its own git</text>
<text x="375" y="364" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">branch.</text>
<text x="656.0" y="304" text-anchor="middle" font-size="16" fill="#FFB74D">&#9654;</text>
<rect x="666" y="214" width="293" height="165" rx="18" fill="#fff" opacity=".97"/>
<circle cx="702" cy="250" r="19" fill="#0B3A6F"/><text x="702" y="257" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">3</text>
<text x="688" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">A separate skeptical agent</text>
<text x="688" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">scores the result on 10</text>
<text x="688" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">dimensions, with evidence.</text>
<text x="40" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#FFB74D">WORKS WITH (all optional)</text>
<rect x="40" y="422" width="116" height="34" rx="17" fill="#1D3A5E"/><text x="98.0" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">Playwright</text>
<rect x="166" y="422" width="159" height="34" rx="17" fill="#1D3A5E"/><text x="245.5" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">Chrome DevTools</text>
<rect x="335" y="422" width="253" height="34" rx="17" fill="#1D3A5E"/><text x="461.5" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">Python 3 (for the scanner)</text>
<rect x="598" y="422" width="55" height="34" rx="17" fill="#1D3A5E"/><text x="625.5" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">Git</text>
<rect x="40" y="512" width="920" height="42" rx="10" fill="#0A1626"/><text x="58" y="539" font-family="Consolas,Menlo,monospace" font-size="15" fill="#7EE787">$ claude plugin install forge@digi-plugins</text>
</svg>