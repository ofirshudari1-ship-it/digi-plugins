<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" x="40" y="34" width="120" height="120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9C3D00"/><stop offset="1" stop-color="#FB8C00"/></linearGradient></defs><rect width="120" height="120" rx="26" fill="url(#g)"/><path d="M25 80 V50 L60 28 L95 50 V80 Z" fill="#fff"/><path d="M20 50 Q40 70 60 50 Q80 70 100 50" fill="none" stroke="#FFB74D" stroke-width="7"/><rect x="50" y="62" width="20" height="18" fill="#9C3D00"/></svg>
<text x="188" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#FFB74D">PLUGIN · 14 AGENTS</text>
<text x="188" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="44" font-weight="800" fill="#fff">Shuk Crew</text>
<text x="188" y="138" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#C9D6E6">Fourteen marketing helpers for Israeli businesses:</text>
<text x="188" y="164" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#C9D6E6">posts, ads, reviews, leads, compliance and more.</text>
<rect x="790" y="34" width="170" height="40" rx="20" fill="#2EA44F"/><text x="875" y="60" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">100% FREE</text>
<text x="40" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#FFB74D">HOW IT WORKS</text>
<rect x="40" y="214" width="293" height="165" rx="18" fill="#fff" opacity=".97"/>
<circle cx="76" cy="250" r="19" fill="#0B3A6F"/><text x="76" y="257" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">1</text>
<text x="62" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">Pick a helper by name:</text>
<text x="62" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">reputation, ads, LinkedIn,</text>
<text x="62" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">leads...</text>
<text x="343.0" y="304" text-anchor="middle" font-size="16" fill="#FFB74D">&#9654;</text>
<rect x="353" y="214" width="293" height="165" rx="18" fill="#fff" opacity=".97"/>
<circle cx="389" cy="250" r="19" fill="#0B3A6F"/><text x="389" y="257" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">2</text>
<text x="375" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">It researches your case and</text>
<text x="375" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">writes drafts or findings.</text>
<text x="656.0" y="304" text-anchor="middle" font-size="16" fill="#FFB74D">&#9654;</text>
<rect x="666" y="214" width="293" height="165" rx="18" fill="#fff" opacity=".97"/>
<circle cx="702" cy="250" r="19" fill="#0B3A6F"/><text x="702" y="257" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">3</text>
<text x="688" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">You approve. Nothing is</text>
<text x="688" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">posted, sent or launched</text>
<text x="688" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#10243E">without you.</text>
<text x="40" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#FFB74D">WORKS WITH (all optional)</text>
<rect x="40" y="422" width="98" height="34" rx="17" fill="#1D3A5E"/><text x="89.0" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">Facebook</text>
<rect x="148" y="422" width="107" height="34" rx="17" fill="#1D3A5E"/><text x="201.5" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">Instagram</text>
<rect x="265" y="422" width="98" height="34" rx="17" fill="#1D3A5E"/><text x="314.0" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">LinkedIn</text>
<rect x="373" y="422" width="227" height="34" rx="17" fill="#1D3A5E"/><text x="486.5" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">Google Business Profile</text>
<rect x="610" y="422" width="55" height="34" rx="17" fill="#1D3A5E"/><text x="637.5" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">GA4</text>
<rect x="675" y="422" width="73" height="34" rx="17" fill="#1D3A5E"/><text x="711.5" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">Gmail</text>
<rect x="758" y="422" width="64" height="34" rx="17" fill="#1D3A5E"/><text x="790.0" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">Make</text>
<rect x="832" y="422" width="55" height="34" rx="17" fill="#1D3A5E"/><text x="859.5" y="444" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff">Wix</text>
<rect x="40" y="512" width="920" height="42" rx="10" fill="#0A1626"/><text x="58" y="539" font-family="Consolas,Menlo,monospace" font-size="15" fill="#7EE787">$ claude plugin install shuk-crew@digi-plugins</text>
